version: '3.9'

services:
  # ─────────────────────────────────────────
  # Base de données PostgreSQL + PostGIS
  # ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: irve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-irve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irvepassword}
      POSTGRES_DB: ${POSTGRES_DB:-irvedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irve} -d ${POSTGRES_DB:-irvedb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - irve_net

  # ─────────────────────────────────────────
  # Redis (sessions + cache)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: irve_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - irve_net

  # ─────────────────────────────────────────
  # Backend NestJS
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: irve_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-irve}:${POSTGRES_PASSWORD:-irvepassword}@postgres:5432/${POSTGRES_DB:-irvedb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_changeme_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3001
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - irve_net
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:dev"

  # ─────────────────────────────────────────
  # Frontend Next.js
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - irve_net

  # ─────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: irve_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - irve_net

  # ─────────────────────────────────────────
  # Adminer (UI base de données - dev only)
  # ─────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: irve_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - irve_net
    profiles:
      - dev-tools

  # ─────────────────────────────────────────
  # pgAdmin 4 (UI PostgreSQL)
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: irve_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - irve_net

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  irve_net:
    driver: bridge